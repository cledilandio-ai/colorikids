# Freebuff CI — GitHub Actions
# Executa typecheck, lint e testes a cada push no main.

name: CI

on:
  push:
    branches: [main]

jobs:
  quality:
    name: "Typecheck + Lint + Tests"
    runs-on: ubuntu-latest

    env:
      POSTGRES_URL: "postgresql://fake:fake@localhost:5432/fake"
      DIRECT_URL: "postgresql://fake:fake@localhost:5432/fake"
      JWT_SECRET: "ci-test-secret-for-github-actions-32chars"
      NEXT_PUBLIC_SUPABASE_URL: "https://fake.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "fake-anon-key"

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Instalar dependências
        run: npm install --frozen-lockfile
        # npm ci falha no GitHub Actions (ubuntu-latest + Node 24 + lockfile
        # gerado no Windows) mesmo com lockfile contendo todas as platforms.
        # npm install --frozen-lockfile é equivalente numa VM limpa e funciona.
        # TODO: migrar para npm ci após investigar diferença de ambiente

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Typecheck (TypeScript)
        run: npx tsc --noEmit --pretty

      - name: Lint (ESLint)
        run: npm run lint

      - name: Testes unitários (Vitest)
        run: npx vitest run --reporter=verbose
